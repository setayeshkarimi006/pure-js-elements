<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider / Tabs</title>
</head>
<body>
    <main class="container1">
        <section class="slider-section">
            <div class="section-title">
                <h1>Image Slider with setayesh karimi</h1>
            </div>
            <div class="slider">
                <button class="slider-btn prev">
                    &#10094;
                </button>
                <img class="slider-image" src="./picture/Dagger-icon-Mainpage.webp" alt="slider image">
                <button class="slider-btn next">
                    &#10095;
                </button>
            </div>
            <!--نقطه های زیر تصاویر -->
            <div class="slider-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </section>
        
    </main>




    <!-- تستک چهارم تب ها و مدال ها  -->

    <main class="container2">
      <section class="card">
        <!-- Header -->
        <header class="header">
          <div >
            <h1 dir="rtl">Content Management</h1>
          </div>
        </header>
        <!-- Tabs -->
        <section class="tabs-section">
          <!--نشانه ها تب -->
          <div class="tabs" id="tabs">
            <button class="tab-btn active"  data-tab="profile">
              profile
            </button>
            <button class="tab-btn" data-tab="settings" >
              Setting
            </button>
            <button  class="tab-btn" data-tab="notifications">
              Notifications
            </button>
          </div>
          <!--خود پوشه تب ها -->
          <div class="tab-content">
            <div class="tab-panel active" data-panel="profile" >
              <h2>User Profile</h2>
              <p>
               here you can watch your profile
              </p>
            </div>
            <div  class="tab-panel" data-panel="settings" >
              <h2>Setting</h2>
              <p>
                here you can control your setting
              </p>
            </div>
            <div class="tab-panel" data-panel="notifications" >
              <h2>Notifications</h2>
              <p>
                here you can see notification
              </p>
            </div>
          </div>
        </section>
        <!-- Dropdown -->
        <section class="dropdown-section">
          <h2>choice collection</h2>
          <div class="dropdown" id="dropdown">
            <button class="dropdown-button" id="dropdown-button">
              <!--داخل باکس  چیزی که اول میبینیم-->
              <span id="selected-option">
                choose one of the option
              </span>
              <span class="arrow">⌄</span>
            </button>
              <!--لیست داخلی کل  دراپ دون -->
            <div class="dropdown-menu" id="dropdown-menu">

              <button data-value="frontend">
                Frontend
              </button>

              <button data-value="javascript">
                JavaScript
              </button>

              <button data-value="react">
                Tailwind
              </button>

              <button data-value="design">
                UI / UX
              </button>

              <button data-value="design">
                React
              </button>

              <button data-value="design">
                Responsive
              </button>

            </div>
          </div>
        </section>
        <!-- Modal -->
        <section class="modal-section">
          <h2>Modal</h2>
          <button id="open-modal" class="primary-btn">
          Opening the Modal
          </button>
        </section>
      </section>
    </main>


    <!-- Modal -->
    <div class="modal-overlay" id="modal" >
      <div class="modal">
        <button class="close-modal" id="close-modal">
          ×
        </button>
        <h2>Hi!</h2>
        <p>
          This is a modal that opens and closes using JavaScript.
        </p>
        <button class="primary-btn" id="modal-ok" >
           Continue
        </button>
      </div>
    </div>


    <script src="./main.js"></script>

</body>
</html>
